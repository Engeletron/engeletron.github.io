name: Deploy to GitHub Pages

# O site passou a ser compilado por Actions em 2026-08-26 (ordem do dono).
# Antes: o Pages servia a branch `main` em modo legacy, que guardava o site JA
# COMPILADO, enquanto o codigo Astro vivia em `source`. Duas linhas para um
# projeto so. Agora ha uma unica linha -- `main`, com o codigo -- e o
# artefato e produzido aqui a cada push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao de cada vez. `cancel-in-progress: false` para nao abortar um
# deploy ja em curso: o site no ar vale mais que a pressa.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `withastro/action@v3` usa Node 20 por padrao e o Astro 6 exige
      # >=22.12.0 (`engines` no package.json) -- a primeira corrida morreu
      # exatamente ai. 24 e a versao que compilou os 69 arquivos conferidos
      # contra o site no ar.
      - uses: withastro/action@v3
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
